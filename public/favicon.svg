<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Deep Jet-Black Boy Hair Volumetric Gradient -->
    <linearGradient id="boyHairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2b2f" />
      <stop offset="35%" stop-color="#18181b" />
      <stop offset="70%" stop-color="#0f0f12" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Warm Skin Gradient -->
    <radialGradient id="boySkinGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fde8d7" />
      <stop offset="70%" stop-color="#f6caa9" />
      <stop offset="100%" stop-color="#e2aa85" />
    </radialGradient>

    <!-- Glass Reflection -->
    <linearGradient id="glassesGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>

    <!-- Outer Shadow Filter -->
    <filter id="avatarGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <g filter="url(#avatarGlow)">
    <!-- Dark Developer Hoodie Bust -->
    <path d="M 22 126 C 22 96 42 90 64 90 C 86 90 106 96 106 126 Z" fill="#141416" />
    <path d="M 44 92 C 52 100 76 100 84 92" fill="none" stroke="#27272a" stroke-width="4" stroke-linecap="round" />

    <!-- Neck -->
    <path d="M 52 78 L 52 92 L 76 92 L 76 78 Z" fill="#e2aa85" />

    <!-- Ears -->
    <circle cx="28" cy="58" r="9" fill="#f6caa9" />
    <circle cx="28" cy="58" r="5" fill="#e2aa85" />
    <circle cx="100" cy="58" r="9" fill="#f6caa9" />
    <circle cx="100" cy="58" r="5" fill="#e2aa85" />

    <!-- Head & Masculine Jaw Base -->
    <path d="M 32 54 C 32 34 46 25 64 25 C 82 25 96 34 96 54 C 96 68 89 81 77 83 C 69 84 59 84 51 83 C 39 81 32 68 32 54 Z" fill="url(#boySkinGrad)" />

    <!-- Cheeks Blush -->
    <ellipse cx="43" cy="68" rx="6" ry="3.5" fill="#fb7185" opacity="0.3" />
    <ellipse cx="85" cy="68" rx="6" ry="3.5" fill="#fb7185" opacity="0.3" />

    <!-- Nose -->
    <ellipse cx="64" cy="62" rx="3.5" ry="3" fill="#e2aa85" />

    <!-- Eyes (3D Gaze) -->
    <!-- Left Eye -->
    <ellipse cx="47" cy="53" rx="7.5" ry="8" fill="#ffffff" />
    <circle cx="48" cy="53" r="5.5" fill="#09090b" />
    <circle cx="48" cy="53" r="3.5" fill="#000000" />
    <circle cx="49.5" cy="51" r="1.8" fill="#ffffff" />
    <circle cx="46.5" cy="55" r="0.9" fill="#ffffff" />

    <!-- Right Eye -->
    <ellipse cx="81" cy="53" rx="7.5" ry="8" fill="#ffffff" />
    <circle cx="80" cy="53" r="5.5" fill="#09090b" />
    <circle cx="80" cy="53" r="3.5" fill="#000000" />
    <circle cx="81.5" cy="51" r="1.8" fill="#ffffff" />
    <circle cx="78.5" cy="55" r="0.9" fill="#ffffff" />

    <!-- Expressive Jet-Black Eyebrows -->
    <path d="M 39 42 Q 47 39 55 43" fill="none" stroke="#09090b" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 89 42 Q 81 39 73 43" fill="none" stroke="#09090b" stroke-width="3.5" stroke-linecap="round" />

    <!-- Titanium Developer Glasses -->
    <!-- Left Rim -->
    <rect x="36" y="43" width="23" height="20" rx="5" fill="url(#glassesGlass)" stroke="#27272a" stroke-width="3" />
    <!-- Right Rim -->
    <rect x="69" y="43" width="23" height="20" rx="5" fill="url(#glassesGlass)" stroke="#27272a" stroke-width="3" />
    <!-- Bridge -->
    <path d="M 59 50 Q 64 47 69 50" fill="none" stroke="#27272a" stroke-width="3" stroke-linecap="round" />

    <!-- Smile -->
    <path d="M 56 73 Q 64 80 72 73" fill="none" stroke="#881337" stroke-width="3.2" stroke-linecap="round" />

    <!-- ================= VOLUMINOUS JET-BLACK BOY HAIR ================= -->
    <!-- Short Sideburns -->
    <path d="M 32 42 L 34 52 L 38 46 Z" fill="#09090b" />
    <path d="M 96 42 L 94 52 L 90 46 Z" fill="#09090b" />

    <!-- Back Volume Dome (Lift & Height) -->
    <ellipse cx="64" cy="24" rx="36" ry="20" fill="url(#boyHairGrad)" />

    <!-- Full Volumetric Textured Jet-Black Quiff & Swept Crown -->
    <path d="
      M 30 42
      C 28 26 36 12 50 7
      C 54 3 62 4 68 3
      C 74 2 82 5 88 8
      C 98 13 100 26 98 42
      C 94 36 88 32 80 30
      C 75 32 70 29 65 31
      C 58 27 52 29 46 32
      C 40 30 35 35 30 42 Z
    " fill="url(#boyHairGrad)" />

    <!-- Volumetric Texture Wave 1 (Mid Layer) -->
    <path d="
      M 34 38
      C 36 22 46 14 58 10
      C 66 8 76 9 84 12
      C 92 16 94 28 92 38
      C 86 32 78 28 70 28
      C 62 26 54 28 48 30
      C 42 28 38 32 34 38 Z
    " fill="#1c1c1f" />

    <!-- Volumetric Front Swept Tufts & Black Sheen Locks -->
    <path d="M 44 14 C 52 20 50 32 40 38 C 46 30 56 26 62 16 Z" fill="#2b2c30" />
    <path d="M 58 10 C 66 18 64 30 54 36 C 62 28 72 24 76 13 Z" fill="#1c1c1f" />
    <path d="M 72 11 C 80 18 80 29 88 34 C 85 27 86 20 80 12 Z" fill="#2b2c30" />
    <path d="M 82 16 C 88 22 88 30 94 34 C 91 26 90 22 86 16 Z" fill="#1c1c1f" />
  </g>
</svg>